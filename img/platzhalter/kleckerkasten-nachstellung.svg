<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="t">
  <title id="t">Platzhalter: Nachstellungsbild wird erstellt</title>
  <defs>
    <!-- watercolour edge: turbulence pushes the blob outlines around -->
    <filter id="wc" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="4" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="90" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation="2.5"/>
    </filter>
    <filter id="ink" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="turbulence" baseFrequency="0.035" numOctaves="3" seed="3" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="40" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="paper">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="2"/>
      <feColorMatrix values="0 0 0 0 0.45  0 0 0 0 0.38  0 0 0 0 0.33  0 0 0 0.07 0"/>
    </filter>
  </defs>
  <rect width="1200" height="800" fill="#F7F1EA"/>
  <rect width="1200" height="800" filter="url(#paper)"/>
  <!-- colour splotches (alcohol-ink / watercolour feel) -->
  <g filter="url(#wc)">
    <circle cx="230" cy="210" r="170" fill="#2F6FB5" opacity="0.55"/>
    <circle cx="330" cy="290" r="110" fill="#5AA9E6" opacity="0.45"/>
    <circle cx="960" cy="180" r="150" fill="#FF6B35" opacity="0.5"/>
    <circle cx="870" cy="250" r="90" fill="#F2B134" opacity="0.5"/>
    <circle cx="1010" cy="620" r="180" fill="#C2417A" opacity="0.42"/>
    <circle cx="190" cy="640" r="130" fill="#3BA58B" opacity="0.42"/>
    <circle cx="610" cy="700" r="90" fill="#7B4FB0" opacity="0.35"/>
  </g>
  <!-- ink drips and dots -->
  <g filter="url(#ink)" fill="#1A1615">
    <circle cx="420" cy="150" r="22" opacity="0.85"/>
    <circle cx="455" cy="182" r="8"/>
    <circle cx="780" cy="560" r="28" opacity="0.8"/>
    <circle cx="812" cy="602" r="10"/>
    <circle cx="300" cy="470" r="12"/>
    <rect x="1080" y="300" width="9" height="140" rx="4" opacity="0.8"/>
    <circle cx="1084" cy="300" r="20" opacity="0.8"/>
  </g>
  <!-- note card in the middle -->
  <g transform="rotate(-2 600 400)">
    <rect x="330" y="290" width="540" height="220" rx="16" fill="#FBF7F3" stroke="#1A1615" stroke-width="3"/>
    <text x="600" y="375" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="44" font-weight="700" fill="#1A1615">Nachstellungsbild</text>
    <text x="600" y="430" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="40" fill="#C2410C">wird erstellt …</text>
    <text x="600" y="478" text-anchor="middle" font-family="system-ui, Arial, sans-serif" font-size="22" fill="#6B5560">Fotos vom ersten Kleckerkasten folgen</text>
  </g>
</svg>
