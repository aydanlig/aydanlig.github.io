<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320">
	<!-- paper grain: a faint, warm fibre noise tiled over the page -->
	<filter id="g" x="0" y="0" width="100%" height="100%">
		<feTurbulence type="fractalNoise" baseFrequency="0.8 0.65" numOctaves="3" seed="4" stitchTiles="stitch"/>
		<feColorMatrix values="0 0 0 0 0.35  0 0 0 0 0.25  0 0 0 0 0.2  0 0 0 -1.6 1.05"/>
	</filter>
	<rect width="320" height="320" filter="url(#g)" opacity=".22"/>
</svg>
